<div class="hct-calc" data-hct-prep>
  <form class="hct-calc__form" novalidate aria-labelledby="{{id}}-prep-h">
    <h3 class="hct-h3" id="{{id}}-prep-h" style="margin-top:0">Was trifft auf Sie zu?</h3>
    <div class="hct-checks">
      <div class="hct-check"><input type="checkbox" id="{{id}}-allergy" name="allergy"><label for="{{id}}-allergy">Ich habe schon einmal auf Röntgen-Kontrastmittel reagiert (z. B. Ausschlag, Atemnot).</label></div>
      <div class="hct-check"><input type="checkbox" id="{{id}}-thyroid" name="thyroid"><label for="{{id}}-thyroid">Ich habe eine Schilddrüsenüberfunktion, Schilddrüsenknoten oder eine geplante Radiojodtherapie.</label></div>
      <div class="hct-check"><input type="checkbox" id="{{id}}-kidney" name="kidney"><label for="{{id}}-kidney">Meine Nierenfunktion ist eingeschränkt.</label></div>
      <div class="hct-check"><input type="checkbox" id="{{id}}-metformin" name="metformin"><label for="{{id}}-metformin">Ich nehme Metformin (Diabetes-Medikament).</label></div>
      <div class="hct-check"><input type="checkbox" id="{{id}}-lungs" name="lungs"><label for="{{id}}-lungs">Ich habe Asthma, eine COPD, einen sehr langsamen Puls oder eine schwere Herzschwäche.</label></div>
      <div class="hct-check"><input type="checkbox" id="{{id}}-pde5" name="pde5"><label for="{{id}}-pde5">Ich nehme Potenzmittel (z. B. Sildenafil, Tadalafil).</label></div>
      <div class="hct-check"><input type="checkbox" id="{{id}}-rhythm" name="rhythm"><label for="{{id}}-rhythm">Ich habe Herzrhythmusstörungen (z. B. Vorhofflimmern) oder einen Herzschrittmacher.</label></div>
      <div class="hct-check"><input type="checkbox" id="{{id}}-pregnancy" name="pregnancy"><label for="{{id}}-pregnancy">Ich bin schwanger oder könnte schwanger sein.</label></div>
    </div>
  </form>
  <div class="hct-calc__result" tabindex="-1" aria-live="polite">
    <h3 class="hct-h3" style="margin:0">Ihre Hinweise</h3>
    <p class="hct-calc__message" data-out="prep-message"></p>
    <ul class="hct-dots" data-out="prep-list"></ul>
  </div>
  <p class="hct-calc__privacy"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Ihre Angaben verlassen Ihr Gerät nicht und werden nicht gespeichert.</p>
</div>
